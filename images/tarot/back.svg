<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- THE BACK OF EVERY CARD.
       To use your own design, replace this file (or change the
       "card-back" line at the top of css/tarot.css to another picture). Keep it 350 x 600, and make
       it look the same upside down so reversed cards don't give themselves away. -->

  <defs>
    <!-- small repeating star + dot print that fills the background -->
    <pattern id="print" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M25 13 L28 22 L37 25 L28 28 L25 37 L22 28 L13 25 L22 22 Z" fill="#f7f1e2" opacity="0.5"/>
      <circle cx="0" cy="0" r="2.4" fill="#f7f1e2" opacity="0.5"/>
      <circle cx="50" cy="0" r="2.4" fill="#f7f1e2" opacity="0.5"/>
      <circle cx="0" cy="50" r="2.4" fill="#f7f1e2" opacity="0.5"/>
      <circle cx="50" cy="50" r="2.4" fill="#f7f1e2" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- indigo card + cream frame -->
  <rect width="350" height="600" fill="#2f34ad"/>
  <rect x="25" y="25" width="300" height="550" fill="url(#print)"/>
  <rect x="14" y="14" width="322" height="572" fill="none" stroke="#f7f1e2" stroke-width="5"/>
  <rect x="25" y="25" width="300" height="550" fill="none" stroke="#f7f1e2" stroke-width="1.5"/>

  <!-- middle medallion: an eight-pointed star with an eye -->
  <g transform="translate(175 300)">
    <circle r="96" fill="#2f34ad" stroke="#f7f1e2" stroke-width="4"/>
    <circle r="86" fill="none" stroke="#f7f1e2" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/>
    <!-- star = two squares, one turned 45 degrees -->
    <rect x="-52" y="-52" width="104" height="104" fill="#c1502f" stroke="#f7f1e2" stroke-width="3"/>
    <rect x="-52" y="-52" width="104" height="104" fill="#c1502f" stroke="#f7f1e2" stroke-width="3" transform="rotate(45)"/>
    <rect x="-50" y="-50" width="100" height="100" fill="#c1502f"/>
    <!-- eye -->
    <path d="M-40 0 Q0 -32 40 0 Q0 32 -40 0 Z" fill="#f7f1e2"/>
    <circle r="14" fill="#2f34ad"/>
    <circle r="5.5" fill="#f7f1e2"/>
  </g>

  <!-- small stars at the top and bottom (mirrored so the card reads the same upside down) -->
  <g fill="#f7f1e2">
    <path d="M175 88 L181 106 L199 112 L181 118 L175 136 L169 118 L151 112 L169 106 Z"/>
    <path d="M175 464 L181 482 L199 488 L181 494 L175 512 L169 494 L151 488 L169 482 Z"/>
  </g>
</svg>
