<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mithai ipsum</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- title box -->
  <div class="box">
    <h1>mithai ipsum</h1>
    <p class="small">placeholder text, but make it sweet. with chai.</p>
  </div>

  <!-- settings -->
  <div class="box">
    <label>
      paragraphs
      <!-- min/max = how many paragraphs allowed -->
      <input type="number" id="paraCount" value="3" min="1" max="20">
    </label>

    <div class="buttons">
      <button id="makeBtn">make more</button>
      <button id="copyBtn">copy</button>
      <!-- "copied!" shows here after copying -->
      <span id="copiedMsg"></span>
    </div>
  </div>

  <!-- ipsum shows up in here -->
  <div class="box" id="output"></div>

  <script src="js/ipsum.js"></script>
</body>
</html>
